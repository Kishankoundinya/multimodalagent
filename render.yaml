services:
  - type: web
    name: financial-research-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_DB_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: DEVICE
        value: cpu
      - key: TEMPERATURE
        value: "0.2"
      - key: MAX_NEW_TOKENS
        value: "1024"
      - key: MAX_REPORT_TOKENS
        value: "2048"
      - key: CHROMA_SERVER_HOST
        sync: false
      - key: CHROMA_SERVER_PORT
        value: "443"
      - key: CHROMA_SERVER_SSL
        value: "true"
      - key: CHROMA_SERVER_AUTH_CREDENTIALS
        sync: false

